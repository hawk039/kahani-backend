services:
  - type: web
    name: kahani-backend
    env: python
    plan: free # Or your desired plan
    buildCommand: |
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kahani-db # This should match the name of your Render database service
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11 # Or your desired Python version
